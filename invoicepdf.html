<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        @media print {
            body {
                background-color: #fff;
            }
            .no-print {
                display: none !important;
            }
            .invoice-container {
                box-shadow: none;
                margin: 0;
                padding: 0;
            }
        }
        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            -webkit-print-color-adjust: exact; /* For better print styling */
            color-adjust: exact;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-gray-100 p-8 print:p-0">

    <div class="max-w-3xl mx-auto bg-white shadow-lg rounded-lg p-6 invoice-container">
        <!-- Invoice Header -->
        <div class="row justify-content-center p-1.5">
            <div>
                <!-- Your Company Logo (Optional) -->
                 <img src="./public/assets/static/kop/header mdi kanan.png" alt="Company Logo" class="grid relative top-2 left-80 w-96 mb-2">
                <img src="./public/assets/static/kop/header mdi kiri.png" alt="Company Logo" class="grid relative -top-16 w-32 right-3 mb-2">
            </div>
        </div>

        <!-- Bill To / Ship To -->
        <div class="grid grid-cols-2 col-span-2 gap-48 mb-8 ml-1.5">
            <div>
                <p class="text-md font-semibold text-gray-700 mb-2">Bill To:</p>
                <p class="text-gray-800"><input type="text" id="clientName" value="Client Name" class="border-b border-gray-300 px-1"></p>
                <p class="text-sm text-gray-600"><input type="text" id="clientAddress1" value="456 Client St" class="border-b border-gray-300 px-1"></p>
                <p class="text-sm text-gray-600"><input type="text" id="clientAddress2" value="City, State, ZIP" class="border-b border-gray-300 px-1"></p>
                <p class="text-sm text-gray-600"><input type="email" id="clientEmail" value="client@example.com" class="border-b border-gray-300 px-1"></p>
            </div>

            <!-- <div class="text-md font-semibold text-gray-700 mb-2">
                <p class="text-gray-800"><input type="text" id="clientName" value="Invoice Number : {{ $sale->invoice_number }}" class="border-b border-gray-300 px-1"></p>
                <p class="text-sm text-gray-600 "><input type="text" id="clientAddress1" value="456 Client St" class="border-b border-gray-300 px-1"></p>
                <p class="text-sm text-gray-600"><input type="text" id="clientAddress2" value="City, State, ZIP" class="border-b border-gray-300 px-1"></p>
                <p class="text-sm text-gray-600"><input type="email" id="clientEmail" value="client@example.com" class="border-b border-gray-300 px-1"></p>
            </div> -->
            <!-- Optional: Ship To -->
            <!-- <div>
                <p class="text-md font-semibold text-gray-700 mb-2">Ship To:</p>
                <p class="text-gray-800">Client Name</p>
                <p class="text-sm text-gray-600">456 Shipping Ln</p>
                <p class="text-sm text-gray-600">City, State, ZIP</p>
            </div> -->
        </div>

        <div class="flex justify-end mr-6 top-96">
            <div class="w-full max-w-xs">
                <div class="flex justify-between mb-2">
                    <span class="text-gray-700">Subtotal:</span>
                    <span id="subtotal" class="font-semibold text-gray-800">0.00</span>
                </div>
                <div class="flex justify-between mb-2">
                    <span class="text-gray-700">Tax (<input type="number" id="taxRate" value="8" min="0" step="0.1" class="w-16 text-right bg-transparent border-b border-gray-300 focus:outline-none focus:border-blue-400 no-print">%):</span>
                    <span id="taxAmount" class="font-semibold text-gray-800">0.00</span>
                </div>
                <div class="flex justify-between mb-2">
                    <span class="text-gray-700">Discount (<input type="number" id="discountRate" value="0" min="0" step="0.1" class="w-16 text-right bg-transparent border-b border-gray-300 focus:outline-none focus:border-blue-400 no-print">%):</span>
                    <span id="discountAmount" class="font-semibold text-gray-800">0.00</span>
                </div>
                <div class="flex justify-between border-t border-gray-300 pt-2">
                    <span class="text-lg font-bold text-gray-800">Grand Total:</span>
                    <span id="grandTotal" class="text-lg font-bold text-blue-600">0.00</span>
                </div>
            </div>
        </div>

        <!-- Invoice Items Table -->
        <div class="mb-8 p-3 mr-1.5">
            <table class="w-full text-left table-auto">
                <thead>
                    <tr class="bg-blue-400 text-gray-800 text-sm leading-normal">
                        <th style="width: 5%;" class="py-3 px-6 text-left">No</th>
                        <th class="py-3 px-6 text-left">Description</th>
                        <th class="py-3 px-6 text-center w-24">Qty</th>
                        <th class="py-3 px-6 text-right w-32">Unit Price</th>
                        <th class="py-3 px-6 text-right w-32">Total</th>
                    </tr>
                </thead>
                <tbody class="text-gray-700 text-sm font-light" id="invoiceItemsTableBody">
                    <!-- Item rows will be added here by JavaScript -->
                    <tr class="border-b border-gray-200 hover:bg-gray-100">
                        <td class="py-3 px-6 text-left">1</td>
                        <td class="py-3 px-6 text-left">
                            <input type="text" value="Service A" class="w-full bg-transparent border-b border-gray-200 focus:outline-none focus:border-blue-400 item-description">
                        </td>
                        <td class="py-3 px-6 text-center">
                            <input type="number" value="1" min="0" class="w-20 text-center bg-transparent border-b border-gray-200 focus:outline-none focus:border-blue-400 item-quantity">
                        </td>
                        <td class="py-3 px-6 text-right">
                            <input type="number" value="100.00" min="0" step="0.01" class="w-24 text-right bg-transparent border-b border-gray-200 focus:outline-none focus:border-blue-400 item-unit-price">
                        </td>
                        <td class="py-3 px-6 text-right item-total">100.00</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Totals Section -->
        <div class="flex justify-end mb-8 mr-6">
            <div class="w-full max-w-xs">
                <div class="flex justify-between mb-2">
                    <span class="text-gray-700">Subtotal:</span>
                    <span id="subtotal" class="font-semibold text-gray-800">0.00</span>
                </div>
                <div class="flex justify-between mb-2">
                    <span class="text-gray-700">Tax (<input type="number" id="taxRate" value="8" min="0" step="0.1" class="w-16 text-right bg-transparent border-b border-gray-300 focus:outline-none focus:border-blue-400 no-print">%):</span>
                    <span id="taxAmount" class="font-semibold text-gray-800">0.00</span>
                </div>
                <div class="flex justify-between mb-2">
                    <span class="text-gray-700">Discount (<input type="number" id="discountRate" value="0" min="0" step="0.1" class="w-16 text-right bg-transparent border-b border-gray-300 focus:outline-none focus:border-blue-400 no-print">%):</span>
                    <span id="discountAmount" class="font-semibold text-gray-800">0.00</span>
                </div>
                <div class="flex justify-between border-t border-gray-300 pt-2">
                    <span class="text-lg font-bold text-gray-800">Grand Total:</span>
                    <span id="grandTotal" class="text-lg font-bold text-blue-600">0.00</span>
                </div>
            </div>
        </div>

        <!-- Notes / Payment Terms -->
        <div class="mb-8">
            <p class="text-md font-semibold text-gray-700 mb-2">Notes:</p>
            <textarea id="invoiceNotes" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-400 h-24 text-sm resize-y">Please make payment within 30 days. Thank you for your business!</textarea>
        </div>

        <!-- Footer / Action Buttons (No-Print) -->
        <div class="text-center no-print">
            <button onclick="window.print()" class="bg-green-500 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg shadow-md focus:outline-none focus:shadow-outline text-lg">
                Print / Save PDF
            </button>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const invoiceItemsTableBody = document.getElementById('invoiceItemsTableBody');
            const addItemBtn = document.getElementById('addItemBtn');
            const subtotalSpan = document.getElementById('subtotal');
            const taxRateInput = document.getElementById('taxRate');
            const taxAmountSpan = document.getElementById('taxAmount');
            const discountRateInput = document.getElementById('discountRate');
            const discountAmountSpan = document.getElementById('discountAmount');
            const grandTotalSpan = document.getElementById('grandTotal');
            const invoiceDateInput = document.getElementById('invoiceDate');

            // Set current date
            const today = new Date();
            invoiceDateInput.value = today.toISOString().split('T')[0];

            function calculateTotals() {
                let currentSubtotal = 0;
                invoiceItemsTableBody.querySelectorAll('tr').forEach(row => {
                    const quantity = parseFloat(row.querySelector('.item-quantity').value) || 0;
                    const unitPrice = parseFloat(row.querySelector('.item-unit-price').value) || 0;
                    const itemTotal = quantity * unitPrice;
                    row.querySelector('.item-total').textContent = itemTotal.toFixed(2);
                    currentSubtotal += itemTotal;
                });

                subtotalSpan.textContent = currentSubtotal.toFixed(2);

                const taxRate = parseFloat(taxRateInput.value) / 100 || 0;
                const taxAmount = currentSubtotal * taxRate;
                taxAmountSpan.textContent = taxAmount.toFixed(2);

                const discountRate = parseFloat(discountRateInput.value) / 100 || 0;
                const discountAmount = currentSubtotal * discountRate;
                discountAmountSpan.textContent = discountAmount.toFixed(2);

                const grandTotal = currentSubtotal + taxAmount - discountAmount;
                grandTotalSpan.textContent = grandTotal.toFixed(2);
            }

            function addEventListenersToRow(row) {
                row.querySelectorAll('.item-quantity, .item-unit-price').forEach(input => {
                    input.addEventListener('input', calculateTotals);
                });
                row.querySelector('.delete-item-btn').addEventListener('click', () => {
                    row.remove();
                    calculateTotals();
                });
            }

            function addNewItemRow() {
                const newRow = document.createElement('tr');
                newRow.className = 'border-b border-gray-200 hover:bg-gray-100';
                newRow.innerHTML = `
                    <td class="py-3 px-6 text-left">
                        <input type="text" value="" placeholder="Item Description" class="w-full bg-transparent border-b border-gray-200 focus:outline-none focus:border-blue-400 item-description">
                    </td>
                    <td class="py-3 px-6 text-center">
                        <input type="number" value="1" min="0" class="w-20 text-center bg-transparent border-b border-gray-200 focus:outline-none focus:border-blue-400 item-quantity">
                    </td>
                    <td class="py-3 px-6 text-right">
                        <input type="number" value="0.00" min="0" step="0.01" class="w-24 text-right bg-transparent border-b border-gray-200 focus:outline-none focus:border-blue-400 item-unit-price">
                    </td>
                    <td class="py-3 px-6 text-right item-total">0.00</td>
                    <td class="py-3 px-6 text-center no-print">
                        <button class="text-red-500 hover:text-red-700 font-bold delete-item-btn">X</button>
                    </td>
                `;
                invoiceItemsTableBody.appendChild(newRow);
                addEventListenersToRow(newRow); // Add listeners for the new row
                calculateTotals(); // Recalculate totals after adding
            }

            // Initial setup for existing rows (if any)
            invoiceItemsTableBody.querySelectorAll('tr').forEach(addEventListenersToRow);

            // Event listeners
            addItemBtn.addEventListener('click', addNewItemRow);
            taxRateInput.addEventListener('input', calculateTotals);
            discountRateInput.addEventListener('input', calculateTotals);

            // Inputs that affect totals but are not item specific
            document.querySelectorAll('#companyName, #companyAddress1, #companyAddress2, #companyEmail, #companyPhone, #clientName, #clientAddress1, #clientAddress2, #clientEmail, #invoiceNumber, #invoiceDate, #invoiceNotes').forEach(input => {
                input.addEventListener('input', calculateTotals); // Recalculate for consistency, though not strictly needed for numerical totals
            });

            // Calculate totals on page load
            calculateTotals();
        });
    </script>
</body>
</html>
